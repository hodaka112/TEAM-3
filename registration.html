<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Son Solar - Registration</title>
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
 
    <style>
        :root {
            --sun-deep: #b34700;
            --sun-orange: #f57c1f;
            --sun-amber: #ffa62b;
            --sun-gold: #ffc542;
            --sun-cream: #fff7e8;
            --sun-border: #f0dcbb;
            --ink: #3a2a18;
            --muted: #9a7f5f;
        }
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
 
        body {
            background: #ffdca0;
            background: linear-gradient(180deg, #ffe9bf 0%, #ffcf85 45%, #f9a03f 100%);
            background-attachment: fixed;
            color: var(--ink);
            -webkit-text-size-adjust: 100%;
        }
 
        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
 
        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid var(--sun-border);
            border-top: 6px solid var(--sun-orange);
            box-shadow: 0 10px 30px rgba(179, 71, 0, 0.18);
        }
 
        .register-card h2 {
            text-align: center;
            font-family: 'Poppins', 'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
            font-weight: 700;
            font-size: 32px;
            font-size: clamp(24px, 6vw, 34px);
            letter-spacing: 0.5px;
            line-height: 1.25;
            color: var(--sun-deep);
            margin-bottom: 10px;
        }
 
        .subtitle {
            text-align: center;
            font-family: 'Poppins', 'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
            font-weight: 500;
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 32px;
        }
 
        .form-group {
            margin-bottom: 22px;
        }
 
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
            color: var(--sun-deep);
        }
 
        input,
        textarea {
            width: 100%;
            max-width: 100%;
            padding: 12px;
            border: 1px solid var(--sun-border);
            border-radius: 8px;
            background: var(--sun-cream);
            color: var(--ink);
            font-size: 16px;
            line-height: 1.4;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
 
        input[type="date"] {
            min-height: 46px;
        }
 
        textarea {
            resize: vertical;
            min-height: 90px;
            font-family: Arial, Helvetica, sans-serif;
        }
 
        input:focus,
        textarea:focus {
            background: #ffffff;
            border-color: var(--sun-orange);
            box-shadow: 0 0 0 3px rgba(245, 124, 31, 0.2);
        }
 
        input::placeholder,
        textarea::placeholder {
            color: #c4a982;
        }
 
        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--sun-orange) 0%, var(--sun-gold) 100%);
            color: #ffffff;
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 124, 31, 0.35);
            -webkit-appearance: none;
            appearance: none;
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
        }
 
        .register-btn:hover {
            filter: brightness(1.05);
            box-shadow: 0 6px 16px rgba(245, 124, 31, 0.45);
        }
 
        .register-btn:active {
            transform: translateY(1px);
        }
 
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
        }
 
        .login-link a {
            color: var(--sun-deep);
            text-decoration: none;
            font-weight: bold;
        }
 
        .login-link a:hover {
            text-decoration: underline;
        }
 
        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            word-wrap: break-word;
        }
 
        @media (max-width: 600px) {
            .container {
                align-items: flex-start;
                padding: 24px 14px;
            }
 
            .register-card {
                padding: 26px 20px;
                border-radius: 14px;
            }
 
            .subtitle {
                margin-bottom: 26px;
            }
 
            .form-group {
                margin-bottom: 18px;
            }
        }
 
        @media (max-width: 360px) {
            .register-card {
                padding: 20px 15px;
            }
 
            label {
                font-size: 15px;
            }
        }
    </style>
</head>
 
<body>
 
    <main class="container">
 
        <div class="register-card">
 
            <h2>Register Account</h2>
 
            <p class="subtitle">
                Please fill in the details to register.
            </p>
 
            <form id="registrationForm" action="register.php" method="post">
 
                <!-- Last Name -->
                <div class="form-group">
                    <label for="lastnm">Last Name:</label>
                    <input
                        type="text"
                        id="lastnm"
                        name="lastnm"
                        placeholder="Enter your Last Name"
                        required
                    >
                </div>
 
                <!-- First Name -->
                <div class="form-group">
                    <label for="firstnm">First Name:</label>
                    <input
                        type="text"
                        id="firstnm"
                        name="firstnm"
                        placeholder="Enter your First Name"
                        required
                    >
                </div>
 
                <!-- Birthdate -->
                <div class="form-group">
                    <label for="birthdate">Birthdate:</label>
                    <input
                        type="date"
                        id="birthdate"
                        name="birthdate"
                        required
                    >
                </div>
 
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>
 
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>
 
                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>
 
                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>
 
                <!-- Phone Number -->
                <div class="form-group">
                    <label for="contactnum">Phone Number:</label>
                    <input
                        type="text"
                        id="contactnum"
                        name="contactnum"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>
 
                <!-- Address -->
                <div class="form-group">
                    <label for="address">Address:</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>
                </div>
 
                <button type="submit" class="register-btn">
                    Register
                </button>
 
                <p id="message"></p>
 
            </form>
 
            <div class="login-link">
                Already have an account?
                <a href="login.php">Login</a>
            </div>
 
        </div>
 
    </main>
 
    <script>
 
        document.getElementById("registrationForm")
            .addEventListener("submit", async function(event) {
 
            event.preventDefault();
 
            const lastnm =
                document.getElementById("lastnm").value.trim();
 
            const firstnm =
                document.getElementById("firstnm").value.trim();
 
            const birthdate =
                document.getElementById("birthdate").value;
 
            const email =
                document.getElementById("email").value.trim();
 
            const username =
                document.getElementById("username").value.trim();
 
            const password =
                document.getElementById("password").value;
 
            const confirmPassword =
                document.getElementById("confirmPassword").value;
 
            const contactnum =
                document.getElementById("contactnum").value.trim();
 
            const address =
                document.getElementById("address").value.trim();
 
            const message =
                document.getElementById("message");
 
 
            /* Last Name */
 
            if (lastnm.length < 2) {
 
                message.textContent =
                    "Please enter your last name.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* First Name */
 
            if (firstnm.length < 2) {
 
                message.textContent =
                    "Please enter your first name.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* Birthdate */
 
            if (birthdate === "") {
 
                message.textContent =
                    "Please enter your birthdate.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* Email */
 
            if (email === "") {
 
                message.textContent =
                    "Please enter your email.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* Username */
 
            if (username.length < 3) {
 
                message.textContent =
                    "Username must be at least 3 characters.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* Password */
 
            if (password.length < 8) {
 
                message.textContent =
                    "Password must be at least 8 characters.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* Confirm Password */
 
            if (password !== confirmPassword) {
 
                message.textContent =
                    "Passwords do not match.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* Phone Number */
 
            if (!/^09[0-9]{9}$/.test(contactnum)) {
 
                message.textContent =
                    "Please enter a valid 11-digit phone number starting with 09.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* Address */
 
            if (address.length < 5) {
 
                message.textContent =
                    "Please enter your complete address.";
 
                message.style.color = "red";
 
                return;
            }
 
 
            /* Successful Registration */
 
            try {

                const response = await fetch(this.action, {
                    method: this.method,
                    body: new FormData(this),
                    headers: { "Accept": "application/json" }
                });

                const result = await response.json();

                message.textContent = result.message;
                message.style.color = result.success ? "green" : "red";

            } catch (error) {

                message.textContent =
                    "Unable to complete registration. Please try again.";

                message.style.color = "red";

            }
 
        });

        // Remove a previous result while the user corrects a field.
        document.getElementById("registrationForm")
            .addEventListener("input", function() {

                document.getElementById("message").textContent = "";

            });

    </script>
 
</body>
</html>
